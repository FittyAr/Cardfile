# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained transitive crates (mostly from GPUI) are reported but only fail for our direct deps.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
# Only permissive licenses. GPL/AGPL/LGPL are never allowed (see docs/PLAN.md §2.1).
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "OFL-1.1",
    "CDLA-Permissive-2.0",
]
unused-allowed-license = "allow"
# Weak copyleft (file-level) is accepted only for these unmodified crates.
exceptions = [
    { allow = ["MPL-2.0"], crate = "spellbook" },
    { allow = ["MPL-2.0"], crate = "cbindgen" },    # build-time only (via GPUI)
    { allow = ["MPL-2.0"], crate = "dwrote" },      # DirectWrite bindings (via GPUI)
    { allow = ["MPL-2.0"], crate = "option-ext" },  # via `directories`
    # Symphonia (cardfile-media): unmodified, audio decoding
    { allow = ["MPL-2.0"], crate = "symphonia" },
    { allow = ["MPL-2.0"], crate = "symphonia-bundle-flac" },
    { allow = ["MPL-2.0"], crate = "symphonia-bundle-mp3" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-pcm" },
    { allow = ["MPL-2.0"], crate = "symphonia-codec-vorbis" },
    { allow = ["MPL-2.0"], crate = "symphonia-common" },
    { allow = ["MPL-2.0"], crate = "symphonia-core" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-ogg" },
    { allow = ["MPL-2.0"], crate = "symphonia-format-riff" },
    { allow = ["MPL-2.0"], crate = "symphonia-metadata" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
