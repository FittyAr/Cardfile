# Checksums and minisign signatures for every release file. Called by release.yml as a
# dist `publish-jobs` entry, so it runs after *all* artifact jobs (local, global and the
# native packages) have finished and *before* the GitHub Release exists: the release is
# created by the `announce` job (dist `github-release = "announce"`), which attaches every
# `artifacts-*` workflow artifact, including the `artifacts-sign` one uploaded here.
# A release is therefore never public without its signatures. If signing fails (or the
# key is missing) this job fails and no release is created.
name: Sign

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - name: Download everything
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: all
          merge-multiple: true
      - name: Checksums and minisign signatures
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          # An unsigned release is never offered by the in-app updater and breaks the
          # one-line installers: refuse to publish one.
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::MINISIGN_SECRET_KEY is not set; refusing to publish an unsigned release"
            exit 1
          fi
          if [ -z "${MINISIGN_PUBLIC_KEY:-}" ]; then
            echo "::error::MINISIGN_PUBLIC_KEY is not set; cannot check the signatures"
            exit 1
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          mkdir -p out
          cd all
          rm -f -- *.json *.sha256
          mapfile -t FILES < <(ls | grep -E '\.(zip|tar\.xz|exe|msix|deb|rpm|AppImage|ps1|sh)$')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no release files to sign"
            exit 1
          fi
          sha256sum -- "${FILES[@]}" > ../out/SHA256SUMS
          cp ../out/SHA256SUMS .

          # The secret key only ever exists in a private temp file that is removed on
          # every exit path, including a failing minisign.
          KEY="$(umask 077 && mktemp "$RUNNER_TEMP/minisign.XXXXXX")"
          trap 'rm -f -- "$KEY"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$KEY"
          for f in "${FILES[@]}" SHA256SUMS; do
            # The app checks this exact comment (cardfile-updater `trusted_comment`).
            minisign -S -s "$KEY" -m "$f" -x "../out/$f.minisig" -t "Cardfile $TAG release file: $f" </dev/null
          done
          rm -f -- "$KEY"

          # The app trusts only this public key (cardfile-updater PUBLIC_KEY).
          for f in "${FILES[@]}" SHA256SUMS; do
            minisign -V -P "$MINISIGN_PUBLIC_KEY" -m "$f" -x "../out/$f.minisig" -q
          done
      - name: Hand the signatures to the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-sign
          path: out/*
          if-no-files-found: error
