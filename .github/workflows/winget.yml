# Submit new releases to the Windows Package Manager community repository.
# Requires the secret WINGET_TOKEN: a classic PAT with `public_repo` scope of an account
# that has forked microsoft/winget-pkgs. The first version must be submitted manually
# (see docs/RELEASING.md); later versions are automated here.
#
# Called by release.yml as a dist `post-announce-jobs` entry, which passes only
# WINGET_TOKEN. A `release` trigger would never fire: the release is created with
# GITHUB_TOKEN, whose events start no workflows.
name: winget

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
    secrets:
      # Optional: winget submission is deferred until 2.0.0, so the secret may not exist
      # yet; a required-but-missing secret would fail the whole release run.
      WINGET_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit (e.g. v2.0.0)
        required: true

# The submission uses WINGET_TOKEN (a PAT for the fork of microsoft/winget-pkgs), not
# GITHUB_TOKEN, so this workflow's own token only needs to read.
permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !fromJson(inputs.plan).announcement_is_prerelease }}
    env:
      # Without the token there is nothing to submit with: say so instead of failing a
      # release that is already published.
      HAS_WINGET_TOKEN: ${{ secrets.WINGET_TOKEN != '' }}
    steps:
      - name: Skip, no WINGET_TOKEN
        if: ${{ env.HAS_WINGET_TOKEN != 'true' }}
        shell: bash
        run: echo "::notice::WINGET_TOKEN is not set, so nothing was submitted to winget. See docs/RELEASING.md."
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        if: ${{ env.HAS_WINGET_TOKEN == 'true' }}
        with:
          identifier: FittyAr.NoteChest
          installers-regex: 'NoteChest-.*-setup-(x64|arm64)\.exe$'
          release-tag: ${{ inputs.tag || fromJson(inputs.plan).announcement_tag }}
          token: ${{ secrets.WINGET_TOKEN }}
