# Submit new releases to the Windows Package Manager community repository.
# Requires the secret WINGET_TOKEN: a classic PAT with `public_repo` scope of an account
# that has forked microsoft/winget-pkgs. The first version must be submitted manually
# (see docs/RELEASING.md); later versions are automated here.
#
# Called by release.yml as a dist `publish-jobs` entry. A `release` trigger would never
# fire: the release is created with GITHUB_TOKEN, whose events start no workflows.
name: winget

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit (e.g. v2.0.0)
        required: true

jobs:
  publish:
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !fromJson(inputs.plan).announcement_is_prerelease }}
    steps:
      - uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: FittyAr.Cardfile
          installers-regex: 'Cardfile-.*-setup-(x64|arm64)\.exe$'
          release-tag: ${{ inputs.tag || fromJson(inputs.plan).announcement_tag }}
          token: ${{ secrets.WINGET_TOKEN }}
