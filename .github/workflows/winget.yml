# Submit new releases to the Windows Package Manager community repository.
# Requires the secret WINGET_TOKEN: a classic PAT with `public_repo` scope of an account
# that has forked microsoft/winget-pkgs. The first version must be submitted manually
# (see docs/RELEASING.md); later versions are automated here.
name: winget

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit (e.g. v2.0.0)
        required: true

jobs:
  publish:
    runs-on: windows-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: FittyAr.Cardfile
          installers-regex: 'Cardfile-.*-setup-(x64|arm64)\.exe$'
          release-tag: ${{ inputs.tag || github.event.release.tag_name }}
          token: ${{ secrets.WINGET_TOKEN }}
