[workspace]
members = ["cargo:."]

# Config for 'dist' (https://github.com/axodotdev/cargo-dist)
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
# One-line installers are install.ps1 / install.sh in the repository root: they always
# install the newest release, so dist does not build version-pinned ones.
installers = []
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
pr-run-mode = "plan"
# Files added to every archive next to the executable.
include = ["packaging/dictionaries", "packaging/out/THIRD_PARTY_LICENSES.html"]
# Install Linux GUI build dependencies and fetch dictionaries/licenses before building.
github-build-setup = "../build-setup.yml"
# Native installers (Inno Setup, MSIX, .deb, .rpm, AppImage).
global-artifacts-jobs = ["./package"]
# The GitHub Release is created in the `announce` job, after every publish job, so it
# never becomes public without its signatures: sign.yml uploads SHA256SUMS and *.minisig
# as an `artifacts-*` workflow artifact and `announce` attaches them with everything else.
# If signing fails, no release is created.
github-release = "announce"
publish-jobs = ["./sign"]
# winget needs the published release (it reads the installer URLs), so it runs after
# `announce`. winget.yml skips pre-releases itself.
post-announce-jobs = ["./winget"]
# Pre-releases still need signatures.
publish-prereleases = true
github-custom-job-permissions = { "sign" = { contents = "read" }, "winget" = { contents = "read" } }
# Third-party actions are pinned to full commit SHAs (tags can be moved): checkout v6.1.0,
# upload-artifact v7.0.2, download-artifact v8.0.2. Run `dist generate` after changing them.
github-action-commits = { "actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803", "actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9", "actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" }

[dist.github-custom-runners]
global = "ubuntu-latest"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
aarch64-pc-windows-msvc = "windows-11-arm"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
