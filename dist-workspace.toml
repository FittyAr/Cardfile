[workspace]
members = ["cargo:."]

# Config for 'dist' (https://github.com/axodotdev/cargo-dist)
[dist]
cargo-dist-version = "0.32.0"
ci = "github"
# One-line installers are install.ps1 / install.sh in the repository root: they always
# install the newest release, so dist does not build version-pinned ones.
installers = []
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
pr-run-mode = "plan"
# Files added to every archive next to the executable.
include = ["packaging/dictionaries", "packaging/out/THIRD_PARTY_LICENSES.html"]
# Install Linux GUI build dependencies and fetch dictionaries/licenses before building.
github-build-setup = "../build-setup.yml"
# Native installers (Inno Setup, MSIX, .deb, .rpm, AppImage).
global-artifacts-jobs = ["./package"]
# After the release exists: checksums + minisign signatures, then winget (stable only).
publish-jobs = ["./sign", "./winget"]
# Pre-releases still need signatures; winget.yml skips them itself.
publish-prereleases = true
# sign.yml attaches SHA256SUMS and *.minisig to the release.
github-custom-job-permissions = { "sign" = { contents = "write" }, "winget" = { contents = "read" } }

[dist.github-custom-runners]
global = "ubuntu-latest"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
aarch64-pc-windows-msvc = "windows-11-arm"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
