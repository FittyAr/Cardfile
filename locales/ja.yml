welcome:
  title: Cardfile へようこそ
  body: |
    ## はじめに

    Cardfile はメモを**カード**として保存します。**+** ボタンまたは **Ctrl+N** で作成できます。

    - ツールバーやショートカットで書式を設定できます: **Ctrl+B** 太字、*Ctrl+I* 斜体、Ctrl+U 下線。
    - `# ` で見出し、`- ` で箇条書き、`[] ` でチェックリストになります。
    - 画像やファイルはカードに貼り付けるかドラッグして追加できます。
    - **Ctrl+F** ですべてのカードを検索、**Ctrl+Shift+P** ですべてのコマンドを表示します。

    ## カードを保護する

    カード上部のロックボタンで、*読み取り専用*、*プライベート*、*暗号化*のいずれかにできます。

    - [ ] 最初のカードを作成する
    - [ ] タグを使ってカードを整理してみる

