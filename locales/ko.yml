welcome:
  title: Cardfile에 오신 것을 환영합니다
  body: |
    ## 시작하기

    Cardfile은 메모를 **카드**로 보관합니다. **+** 버튼이나 **Ctrl+N**으로 카드를 만드세요.

    - 도구 모음이나 단축키로 서식을 지정하세요: **Ctrl+B** 굵게, *Ctrl+I* 기울임꼴, Ctrl+U 밑줄.
    - `# `를 입력하면 제목, `- `는 목록, `[] `는 체크리스트가 됩니다.
    - 이미지와 파일을 카드에 붙여넣거나 끌어다 놓으세요.
    - **Ctrl+F**로 모든 카드를 검색하고 **Ctrl+Shift+P**로 모든 명령을 확인하세요.

    ## 카드 보호하기

    카드 상단의 잠금 버튼으로 카드를 *읽기 전용*, *비공개* 또는 *암호화* 상태로 만들 수 있습니다.

    - [ ] 첫 번째 카드 만들기
    - [ ] 태그로 카드를 정리해 보기

