welcome:
  title: Вітаємо в Cardfile
  body: |
    ## Початок роботи

    Cardfile зберігає ваші нотатки у вигляді **карток**. Створіть картку кнопкою **+** або сполученням **Ctrl+N**.

    - Форматуйте текст за допомогою панелі інструментів або скорочень: **Ctrl+B** — жирний, *Ctrl+I* — курсив, Ctrl+U — підкреслення.
    - Введіть `# ` для заголовка, `- ` для списку або `[] ` для списку завдань.
    - Вставляйте або перетягуйте зображення та файли в картку.
    - **Ctrl+F** — пошук у всіх картках, **Ctrl+Shift+P** — перелік усіх команд.

    ## Захистіть свої картки

    Кнопка із замком угорі картки робить її *лише для читання*, *приватною* або *зашифрованою*.

    - [ ] Створіть свою першу картку
    - [ ] Спробуйте мітку, щоб упорядкувати картки

