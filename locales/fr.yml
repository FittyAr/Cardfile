welcome:
  title: Bienvenue dans Cardfile
  body: |
    ## Pour commencer

    Cardfile conserve vos notes sous forme de **fiches**. Créez-en une avec le bouton **+** ou **Ctrl+N**.

    - Mettez le texte en forme avec la barre d'outils ou les raccourcis : **Ctrl+B** gras, *Ctrl+I* italique, Ctrl+U souligné.
    - Tapez `# ` pour un titre, `- ` pour une liste ou `[] ` pour une liste de contrôle.
    - Collez ou glissez des images et des fichiers dans une fiche.
    - Utilisez **Ctrl+F** pour rechercher dans toutes vos fiches et **Ctrl+Shift+P** pour accéder à toutes les commandes.

    ## Protégez vos fiches

    Utilisez le bouton de cadenas en haut d'une fiche pour la rendre *en lecture seule*, *privée* ou *chiffrée*.

    - [ ] Créez votre première fiche
    - [ ] Essayez une étiquette pour organiser vos fiches

