welcome:
  title: Selamat datang di Cardfile
  body: |
    ## Memulai

    Cardfile menyimpan catatan Anda sebagai **kartu**. Buat kartu dengan tombol **+** atau **Ctrl+N**.

    - Format teks dengan bilah alat atau pintasan: **Ctrl+B** tebal, *Ctrl+I* miring, Ctrl+U garis bawah.
    - Ketik `# ` untuk judul, `- ` untuk daftar, atau `[] ` untuk daftar periksa.
    - Tempel atau seret gambar dan berkas ke dalam kartu.
    - Gunakan **Ctrl+F** untuk mencari di semua kartu dan **Ctrl+Shift+P** untuk melihat semua perintah.

    ## Lindungi kartu Anda

    Gunakan tombol gembok di bagian atas kartu untuk menjadikannya *hanya-baca*, *pribadi*, atau *terenkripsi*.

    - [ ] Buat kartu pertama Anda
    - [ ] Coba label untuk mengatur kartu

