welcome:
  title: Witamy w Cardfile
  body: |
    ## Pierwsze kroki

    Cardfile przechowuje Twoje notatki jako **karty**. Utwórz kartę przyciskiem **+** lub skrótem **Ctrl+N**.

    - Formatuj tekst paskiem narzędzi lub skrótami: **Ctrl+B** pogrubienie, *Ctrl+I* kursywa, Ctrl+U podkreślenie.
    - Wpisz `# ` dla nagłówka, `- ` dla listy lub `[] ` dla listy kontrolnej.
    - Wklejaj lub przeciągaj obrazy i pliki do karty.
    - Użyj **Ctrl+F**, aby przeszukać wszystkie karty, i **Ctrl+Shift+P**, aby zobaczyć wszystkie polecenia.

    ## Chroń swoje karty

    Użyj przycisku kłódki u góry karty, aby ustawić ją jako *tylko do odczytu*, *prywatną* lub *zaszyfrowaną*.

    - [ ] Utwórz swoją pierwszą kartę
    - [ ] Wypróbuj tag do porządkowania kart

