welcome:
  title: Welcome to Cardfile
  body: |
    ## Getting started

    Cardfile keeps your notes as **cards**. Create one with the **+** button or **Ctrl+N**.

    - Format text with the toolbar or shortcuts: **Ctrl+B** bold, *Ctrl+I* italic, Ctrl+U underline.
    - Type `# ` for a heading, `- ` for a list or `[] ` for a checklist.
    - Paste or drag images and files into a card.
    - Use **Ctrl+F** to search all your cards and **Ctrl+Shift+P** for every command.

    ## Protect your cards

    Use the lock button at the top of a card to make it *read-only*, *private* or *encrypted*.

    - [ ] Create your first card
    - [ ] Try a tag to organize cards

