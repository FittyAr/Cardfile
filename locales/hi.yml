welcome:
  title: Cardfile में आपका स्वागत है
  body: |
    ## शुरुआत करें

    Cardfile आपके नोट्स को **कार्ड** के रूप में सहेजता है। **+** बटन या **Ctrl+N** से नया कार्ड बनाएँ।

    - टूलबार या शॉर्टकट से टेक्स्ट फ़ॉर्मैट करें: **Ctrl+B** बोल्ड, *Ctrl+I* इटैलिक, Ctrl+U रेखांकित।
    - शीर्षक के लिए `# `, सूची के लिए `- ` या चेकलिस्ट के लिए `[] ` टाइप करें।
    - चित्र और फ़ाइलें कार्ड में पेस्ट करें या खींचकर छोड़ें।
    - सभी कार्ड खोजने के लिए **Ctrl+F** और सभी कमांड देखने के लिए **Ctrl+Shift+P** दबाएँ।

    ## अपने कार्ड सुरक्षित रखें

    कार्ड के ऊपर दिए गए ताले के बटन से उसे *केवल पढ़ने योग्य*, *निजी* या *एन्क्रिप्टेड* बनाएँ।

    - [ ] अपना पहला कार्ड बनाएँ
    - [ ] कार्ड व्यवस्थित करने के लिए कोई टैग आज़माएँ

