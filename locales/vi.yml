welcome:
  title: Chào mừng đến với Cardfile
  body: |
    ## Bắt đầu

    Cardfile lưu ghi chú của bạn dưới dạng **thẻ**. Tạo thẻ bằng nút **+** hoặc **Ctrl+N**.

    - Định dạng văn bản bằng thanh công cụ hoặc phím tắt: **Ctrl+B** in đậm, *Ctrl+I* in nghiêng, Ctrl+U gạch chân.
    - Gõ `# ` để tạo tiêu đề, `- ` để tạo danh sách hoặc `[] ` để tạo danh sách kiểm.
    - Dán hoặc kéo thả hình ảnh và tệp vào thẻ.
    - Dùng **Ctrl+F** để tìm trong tất cả thẻ và **Ctrl+Shift+P** để xem mọi lệnh.

    ## Bảo vệ thẻ của bạn

    Dùng nút ổ khóa ở đầu thẻ để chuyển thẻ sang *chỉ đọc*, *riêng tư* hoặc *đã mã hóa*.

    - [ ] Tạo thẻ đầu tiên của bạn
    - [ ] Thử một nhãn để sắp xếp thẻ

