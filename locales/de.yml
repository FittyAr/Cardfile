welcome:
  title: Willkommen bei Cardfile
  body: |
    ## Erste Schritte

    Cardfile speichert Ihre Notizen als **Karten**. Erstellen Sie eine mit der Schaltfläche **+** oder mit **Strg+N**.

    - Formatieren Sie Text mit der Symbolleiste oder Tastenkürzeln: **Strg+B** fett, *Strg+I* kursiv, Strg+U unterstrichen.
    - Tippen Sie `# ` für eine Überschrift, `- ` für eine Liste oder `[] ` für eine Checkliste.
    - Fügen Sie Bilder und Dateien per Einfügen oder Ziehen in eine Karte ein.
    - Mit **Strg+F** durchsuchen Sie alle Karten, mit **Strg+Umschalt+P** sehen Sie alle Befehle.

    ## Schützen Sie Ihre Karten

    Mit der Schloss-Schaltfläche oben auf einer Karte machen Sie sie *schreibgeschützt*, *privat* oder *verschlüsselt*.

    - [ ] Erstellen Sie Ihre erste Karte
    - [ ] Probieren Sie ein Schlagwort aus, um Karten zu ordnen

