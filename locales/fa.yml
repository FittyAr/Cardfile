welcome:
  title: به Cardfile خوش آمدید
  body: |
    ## شروع کار

    Cardfile یادداشت‌های شما را به‌صورت **کارت** نگه می‌دارد. با دکمه **+** یا **Ctrl+N** کارت بسازید.

    - متن را با نوار ابزار یا میان‌برها قالب‌بندی کنید: **Ctrl+B** پررنگ، *Ctrl+I* کج، Ctrl+U زیرخط.
    - برای عنوان `# `، برای فهرست `- ` و برای فهرست کارها `[] ` تایپ کنید.
    - تصاویر و فایل‌ها را در کارت بچسبانید یا بکشید و رها کنید.
    - با **Ctrl+F** در همه کارت‌ها جست‌وجو کنید و با **Ctrl+Shift+P** همه دستورها را ببینید.

    ## از کارت‌های خود محافظت کنید

    با دکمه قفل در بالای کارت، آن را *فقط‌خواندنی*، *خصوصی* یا *رمزگذاری‌شده* کنید.

    - [ ] اولین کارت خود را بسازید
    - [ ] یک برچسب را برای سازمان‌دهی کارت‌ها امتحان کنید

