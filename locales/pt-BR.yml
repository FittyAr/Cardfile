welcome:
  title: Boas-vindas ao Cardfile
  body: |
    ## Primeiros passos

    O Cardfile guarda suas notas como **cartões**. Crie um com o botão **+** ou **Ctrl+N**.

    - Formate o texto com a barra de ferramentas ou atalhos: **Ctrl+B** negrito, *Ctrl+I* itálico, Ctrl+U sublinhado.
    - Digite `# ` para um título, `- ` para uma lista ou `[] ` para uma lista de tarefas.
    - Cole ou arraste imagens e arquivos para um cartão.
    - Use **Ctrl+F** para pesquisar em todos os seus cartões e **Ctrl+Shift+P** para ver todos os comandos.

    ## Proteja seus cartões

    Use o botão de cadeado no topo de um cartão para torná-lo *somente leitura*, *privado* ou *criptografado*.

    - [ ] Crie seu primeiro cartão
    - [ ] Experimente uma etiqueta para organizar os cartões

