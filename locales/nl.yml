welcome:
  title: Welkom bij Cardfile
  body: |
    ## Aan de slag

    Cardfile bewaart je notities als **kaarten**. Maak er een met de knop **+** of met **Ctrl+N**.

    - Maak tekst op met de werkbalk of sneltoetsen: **Ctrl+B** vet, *Ctrl+I* cursief, Ctrl+U onderstrepen.
    - Typ `# ` voor een kop, `- ` voor een lijst of `[] ` voor een checklist.
    - Plak of sleep afbeeldingen en bestanden in een kaart.
    - Gebruik **Ctrl+F** om al je kaarten te doorzoeken en **Ctrl+Shift+P** voor alle opdrachten.

    ## Beveilig je kaarten

    Gebruik de slotknop bovenaan een kaart om hem *alleen-lezen*, *privé* of *versleuteld* te maken.

    - [ ] Maak je eerste kaart
    - [ ] Probeer een label om kaarten te ordenen

