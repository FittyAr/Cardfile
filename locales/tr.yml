welcome:
  title: Cardfile'a hoş geldiniz
  body: |
    ## Başlarken

    Cardfile notlarınızı **kartlar** olarak saklar. **+** düğmesiyle veya **Ctrl+N** ile bir kart oluşturun.

    - Metni araç çubuğuyla veya kısayollarla biçimlendirin: **Ctrl+B** kalın, *Ctrl+I* italik, Ctrl+U altı çizili.
    - Başlık için `# `, liste için `- `, yapılacaklar listesi için `[] ` yazın.
    - Resim ve dosyaları karta yapıştırın veya sürükleyin.
    - Tüm kartlarınızda aramak için **Ctrl+F**, tüm komutları görmek için **Ctrl+Shift+P** kullanın.

    ## Kartlarınızı koruyun

    Bir kartın üstündeki kilit düğmesiyle onu *salt okunur*, *özel* veya *şifreli* yapın.

    - [ ] İlk kartınızı oluşturun
    - [ ] Kartları düzenlemek için bir etiket deneyin

