welcome:
  title: Te damos la bienvenida a Cardfile
  body: |
    ## Primeros pasos

    Cardfile guarda tus notas como **fichas**. Crea una con el botón **+** o con **Ctrl+N**.

    - Da formato al texto con la barra de herramientas o con atajos: **Ctrl+B** negrita, *Ctrl+I* cursiva, Ctrl+U subrayado.
    - Escribe `# ` para un título, `- ` para una lista o `[] ` para una lista de tareas.
    - Pega o arrastra imágenes y archivos a una ficha.
    - Usa **Ctrl+F** para buscar en todas tus fichas y **Ctrl+Shift+P** para ver todos los comandos.

    ## Protege tus fichas

    Usa el botón del candado en la parte superior de una ficha para hacerla *de solo lectura*, *privada* o *cifrada*.

    - [ ] Crea tu primera ficha
    - [ ] Prueba una etiqueta para organizar las fichas

