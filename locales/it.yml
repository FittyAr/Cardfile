welcome:
  title: Benvenuto in Cardfile
  body: |
    ## Per iniziare

    Cardfile conserva i tuoi appunti come **schede**. Creane una con il pulsante **+** o con **Ctrl+N**.

    - Formatta il testo con la barra degli strumenti o con le scorciatoie: **Ctrl+B** grassetto, *Ctrl+I* corsivo, Ctrl+U sottolineato.
    - Digita `# ` per un titolo, `- ` per un elenco o `[] ` per una lista di controllo.
    - Incolla o trascina immagini e file in una scheda.
    - Usa **Ctrl+F** per cercare in tutte le schede e **Ctrl+Maiusc+P** per vedere tutti i comandi.

    ## Proteggi le tue schede

    Usa il pulsante del lucchetto in cima a una scheda per renderla *di sola lettura*, *privata* o *crittografata*.

    - [ ] Crea la tua prima scheda
    - [ ] Prova un'etichetta per organizzare le schede

