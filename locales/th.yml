welcome:
  title: ยินดีต้อนรับสู่ Cardfile
  body: |
    ## เริ่มต้นใช้งาน

    Cardfile เก็บบันทึกของคุณเป็น **การ์ด** สร้างการ์ดได้ด้วยปุ่ม **+** หรือ **Ctrl+N**

    - จัดรูปแบบข้อความด้วยแถบเครื่องมือหรือทางลัด: **Ctrl+B** ตัวหนา, *Ctrl+I* ตัวเอียง, Ctrl+U ขีดเส้นใต้
    - พิมพ์ `# ` สำหรับหัวเรื่อง, `- ` สำหรับรายการ หรือ `[] ` สำหรับรายการตรวจสอบ
    - วางหรือลากรูปภาพและไฟล์ลงในการ์ด
    - ใช้ **Ctrl+F** เพื่อค้นหาในการ์ดทั้งหมด และ **Ctrl+Shift+P** เพื่อดูคำสั่งทั้งหมด

    ## ปกป้องการ์ดของคุณ

    ใช้ปุ่มแม่กุญแจที่ด้านบนของการ์ดเพื่อตั้งเป็น *อ่านอย่างเดียว*, *ส่วนตัว* หรือ *เข้ารหัส*

    - [ ] สร้างการ์ดใบแรกของคุณ
    - [ ] ลองใช้แท็กเพื่อจัดระเบียบการ์ด

