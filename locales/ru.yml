welcome:
  title: Добро пожаловать в Cardfile
  body: |
    ## Начало работы

    Cardfile хранит ваши заметки в виде **карточек**. Создайте карточку кнопкой **+** или сочетанием **Ctrl+N**.

    - Форматируйте текст с помощью панели инструментов или сочетаний клавиш: **Ctrl+B** — жирный, *Ctrl+I* — курсив, Ctrl+U — подчёркивание.
    - Введите `# ` для заголовка, `- ` для списка или `[] ` для списка задач.
    - Вставляйте или перетаскивайте изображения и файлы в карточку.
    - **Ctrl+F** — поиск по всем карточкам, **Ctrl+Shift+P** — список всех команд.

    ## Защитите свои карточки

    Кнопка с замком в верхней части карточки делает её *доступной только для чтения*, *личной* или *зашифрованной*.

    - [ ] Создайте первую карточку
    - [ ] Попробуйте метку, чтобы упорядочить карточки

