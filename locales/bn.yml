welcome:
  title: Cardfile-এ স্বাগতম
  body: |
    ## শুরু করুন

    Cardfile আপনার নোটগুলো **কার্ড** আকারে সংরক্ষণ করে। **+** বোতাম বা **Ctrl+N** দিয়ে কার্ড তৈরি করুন।

    - টুলবার বা শর্টকাট দিয়ে লেখা ফরম্যাট করুন: **Ctrl+B** বোল্ড, *Ctrl+I* ইটালিক, Ctrl+U আন্ডারলাইন।
    - শিরোনামের জন্য `# `, তালিকার জন্য `- ` অথবা চেকলিস্টের জন্য `[] ` লিখুন।
    - ছবি ও ফাইল কার্ডে পেস্ট করুন বা টেনে আনুন।
    - সব কার্ডে খুঁজতে **Ctrl+F** এবং সব কমান্ড দেখতে **Ctrl+Shift+P** ব্যবহার করুন।

    ## আপনার কার্ড সুরক্ষিত রাখুন

    কার্ডের উপরের তালার বোতাম দিয়ে একে *শুধু পড়ার জন্য*, *ব্যক্তিগত* বা *এনক্রিপ্টেড* করুন।

    - [ ] আপনার প্রথম কার্ড তৈরি করুন
    - [ ] কার্ড গুছিয়ে রাখতে একটি ট্যাগ চেষ্টা করুন

