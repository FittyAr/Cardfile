welcome:
  title: مرحباً بك في Cardfile
  body: |
    ## البداية

    يحفظ Cardfile ملاحظاتك على شكل **بطاقات**. أنشئ بطاقة بزر **+** أو بالضغط على **Ctrl+N**.

    - نسّق النص من شريط الأدوات أو بالاختصارات: **Ctrl+B** غامق، *Ctrl+I* مائل، Ctrl+U تسطير.
    - اكتب `# ` لعنوان، أو `- ` لقائمة، أو `[] ` لقائمة مهام.
    - الصق الصور والملفات في البطاقة أو اسحبها إليها.
    - استخدم **Ctrl+F** للبحث في كل بطاقاتك و**Ctrl+Shift+P** لعرض كل الأوامر.

    ## احمِ بطاقاتك

    استخدم زر القفل أعلى البطاقة لجعلها *للقراءة فقط* أو *خاصة* أو *مشفّرة*.

    - [ ] أنشئ بطاقتك الأولى
    - [ ] جرّب وسماً لتنظيم البطاقات

