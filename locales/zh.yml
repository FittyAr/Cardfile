welcome:
  title: 欢迎使用 Cardfile
  body: |
    ## 快速入门

    Cardfile 以**卡片**的形式保存您的笔记。点击 **+** 按钮或按 **Ctrl+N** 即可新建。

    - 使用工具栏或快捷键设置文字格式：**Ctrl+B** 粗体，*Ctrl+I* 斜体，Ctrl+U 下划线。
    - 输入 `# ` 创建标题，`- ` 创建列表，`[] ` 创建待办清单。
    - 可将图片和文件粘贴或拖入卡片。
    - 按 **Ctrl+F** 搜索所有卡片，按 **Ctrl+Shift+P** 查看全部命令。

    ## 保护您的卡片

    使用卡片顶部的锁形按钮，可将其设为*只读*、*私密*或*加密*。

    - [ ] 创建您的第一张卡片
    - [ ] 试用标签来整理卡片

