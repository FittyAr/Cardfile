[package]
name = "cardfile"
description = "Cardfile - a modern digital card file for your notes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cardfile-ui.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["update-check"]
# Notify about new GitHub releases. Disable for Store / package-manager builds.
update-check = ["cardfile-ui/update-check"]
